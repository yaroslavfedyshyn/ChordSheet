name: ChordSheet
options:
  bundleIdPrefix: com.chordsheet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  ChordSheet:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChordSheet
        excludes:
          - "**/*.md"
    info:
      path: ChordSheet/Info.plist
      properties:
        CFBundleDisplayName: "Chord Sheet"
        UILaunchScreen: {}
        UIAppFonts:
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-Bold.ttf
          - IBMPlexSans-Regular.ttf
          - IBMPlexSans-Medium.ttf
          - IBMPlexSans-SemiBold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIViewControllerBasedStatusBarAppearance: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chordsheet.app
        PRODUCT_NAME: ChordSheet
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ChordSheetUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChordSheetUITests
    dependencies:
      - target: ChordSheet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chordsheet.app.uitests
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ChordSheet
schemes:
  ChordSheet:
    build:
      targets:
        ChordSheet: all
        ChordSheetUITests: [test]
    test:
      targets:
        - ChordSheetUITests
    run:
      config: Debug
